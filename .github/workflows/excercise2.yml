name: Tests

on:
  pull_request:                 # run when a pull request is opened or updated
  push:
    branches: [main]            # and when code lands on main

permissions:
  contents: read                # least privilege: the robot may only READ the code

jobs:
  test:
    name: Test on Node ${{ matrix.node }}   # readable name, e.g. "Test on Node 22"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]          # the same job runs once per version (two "ovens")
    steps:
      - name: Download the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}   # the version for this particular run
          cache: npm                         # keep downloaded libraries in the "fridge"

      - name: Install dependencies
        run: npm ci                          # exact, reproducible install from the lock file

      - name: Check code style
        run: npm run lint                    # fail early on cheap checks

      - name: Run the tests
        run: npm test                        # if this fails, the job fails, and the PR shows a red X

      - name: Save the test report
        if: always()                         # even if the tests failed, keep the report
        uses: actions/upload-artifact@v7
        with:
          name: test-report-node-${{ matrix.node }}   # must be unique for each matrix run
          path: reports/                              # the folder to save
          if-no-files-found: ignore                   # don't complain if there is none
